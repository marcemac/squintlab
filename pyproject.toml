[project]
name = "squintlab"
dynamic = ["version"]
description = "Analyses photos of paintings through perceptual mechanisms and reports descriptive observations to the artist."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Marcelo Almenara Campos" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "platformdirs>=4.14.3",
]

[project.urls]
Repository = "https://github.com/marcemac/squintlab"
Issues = "https://github.com/marcemac/squintlab/issues"
Changelog = "https://github.com/marcemac/squintlab/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "mypy>=2.4.1",
    "pytest",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/squintlab/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/squintlab"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
files = ["src/squintlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: test needs internet access (use --run-network)"]
