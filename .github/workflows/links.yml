name: Links (weekly)

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external:
    name: external links
    runs-on: ubuntu-latest
    # Reports only: a broken external link never blocks a merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --max-retries 3 --accept '100..=103,200..=299,429' './**/*.md'
          fail: true
